services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dds112
      POSTGRES_USER: dds112
      POSTGRES_PASSWORD: dds112
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dds112 -d dds112"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [training]

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [training]
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    networks: [training]

volumes:
  postgres_data:

networks:
  training:
    driver: bridge
    internal: false
